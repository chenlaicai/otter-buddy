<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>獭桌三麻</title>
<link rel="stylesheet" href="/mahjong/assets/style.css">
</head>
<body>
<!-- 牌局页（F20261015mjsg 模块四 → F20261020mjui v3 骨架）：/mahjong = 大厅，/mahjong/:roomId = 牌局。
     所有内容由 js/app.js 从 /api/mahjong 视图渲染，此处只给挂载点。
     v3 = 一整块绿台面 .table-felt：三家牌河围桌心三方（牌字符全正朝向）+ 中央信息盘
          兼结算停驻位与 claim 浮层 + 玩家信息条按座位落角 + 近端手牌 + 底部聊天通栏。 -->
<div id="app" data-state="loading">
  <main id="felt" class="table-felt">
    <!-- 场况角标（台面左上）：宝牌指示 · 牌型提醒预留槽位 · 连接态 · 停局 -->
    <header id="field" class="felt-corner" aria-label="场况角标"></header>

    <!-- 上家（桌心远侧）：信息条 + 暗牌 + 副露 + 上家河 -->
    <section id="kamicha" class="pseat pseat--top" aria-label="上家"></section>

    <!-- 下家（桌心右侧）：信息条 + 暗牌 + 副露 + 下家河 -->
    <section id="shimocha" class="pseat pseat--right" aria-label="下家"></section>

    <!-- 中央信息盘（对局态必驻）：局数/本场/供托/余牌 + 轮到谁 -->
    <section id="hub" class="info-hub" aria-label="中央信息盘">
      <span class="ih-series" id="hubSeries"></span>
      <span class="ih-round" id="hubRound"></span>
      <span class="ih-row" id="hubRow"></span>
      <div id="turnStatus" class="ih-turn" aria-live="polite"></div>
    </section>

    <!-- 结算停驻（与信息盘互斥：data-state=play|settle 切换） -->
    <div id="settlePanel" class="settle-panel" hidden></div>

    <!-- claim 浮层：盖桌心；pointer-events 收在卡片上，动作栏/手牌不受拦截 -->
    <div id="claim" class="claim-overlay" hidden></div>

    <!-- 自己（桌心近侧）：信息条 · 自己河 · 副露/拔北 -->
    <div class="selfrow">
      <div id="selfInfo" class="pinfo pinfo--self" aria-label="自己"></div>
      <div id="riverSelf" class="discards river" aria-label="自己的牌河"></div>
      <div id="selfMelds" class="melds melds-zone" aria-label="自己的副露"></div>
    </div>

    <!-- 近端底部：动作栏（⏱ 计时器渲染位随迁在此）+ 自家手牌横铺 -->
    <div class="hand-zone">
      <div id="actionbar" class="actionbar" role="toolbar" aria-label="动作"></div>
      <div id="hand" class="hand" aria-label="手牌"></div>
    </div>
  </main>

  <!-- 聊天/日志：独立底部通栏（日志流横排左 + 输入框右，不与任何玩家条挤） -->
  <div class="chatbar">
    <div class="log-strip">
      <span class="ls-label">动态</span>
      <ol id="log" aria-label="牌局动态"></ol>
    </div>
    <div id="chatBar" class="chat-input" hidden>
      <input id="chatInput" type="text" maxlength="500" placeholder="对桌上说点什么…" aria-label="聊天输入" autocomplete="off">
      <button id="chatSend" class="btn btn--accent" type="button">说</button>
    </div>
  </div>

  <div id="overlay" class="overlay" hidden>
    <div id="overlayBox" class="overlay-box" role="dialog" aria-modal="true"></div>
  </div>

  <div id="toast" class="toast" hidden role="status"></div>
</div>

<script type="module" src="/mahjong/assets/js/app.js"></script>
</body>
</html>
