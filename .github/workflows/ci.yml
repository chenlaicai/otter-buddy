name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Check PR title format
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # 检查 PR 标题是否包含特性编号格式：[F{日期}{随机字符}]
          # 例如：[F20260727ui6x]、[F20260724glas]、[F20260725otid]
          if ! echo "$PR_TITLE" | grep -qE '^\[F[0-9]{8}[a-zA-Z0-9]{4,}\]'; then
            echo "❌ PR 标题格式错误"
            echo "当前标题: $PR_TITLE"
            echo ""
            echo "PR 标题必须以特性编号开头，格式为：[F{日期}{随机字符}]"
            echo "示例："
            echo "  [F20260727ui6x][web][BugFix] 对话界面多项 UI 修复"
            echo "  [F20260724glas][web][Feature Update] UI 玻璃材质体系重设计 v2.3"
            echo "  [F20260725otid] Otter 身份认知体系 + 搭档术语统一"
            echo ""
            echo "特性编号规则："
            echo "  - F: 固定前缀"
            echo "  - {日期}: 8位数字，格式 YYYYMMDD"
            echo "  - {随机字符}: 4位以上字母数字"
            exit 1
          fi
          echo "✅ PR 标题格式正确"

      - name: Check if PR is up to date with main
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main:main
          MERGE_BASE=$(git merge-base HEAD main)
          MAIN_HEAD=$(git rev-parse main)
          if [ "$MERGE_BASE" != "$MAIN_HEAD" ]; then
            echo "❌ PR branch is behind main. Please rebase or merge main into your branch."
            echo "Merge base: $MERGE_BASE"
            echo "Main HEAD:  $MAIN_HEAD"
            exit 1
          fi
          echo "✅ PR branch is up to date with main"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full project checks
        run: npm run check

      - name: Build web frontend (tsc + vite)
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Run tests
        run: npm test
