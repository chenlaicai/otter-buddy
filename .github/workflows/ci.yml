name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Check PR title format
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # PR 标题格式：[ID][模块] 描述
          # ID: [F{日期}{随机字符}] 或 [R{日期}{随机字符}]
          # 模块: [agent] [web] [prompt] [research] 等
          if ! echo "$PR_TITLE" | grep -qE '^\[[FR][0-9]{8}[a-zA-Z0-9]{4,}\]\[[a-z]+\]'; then
            echo "❌ PR 标题格式错误"
            echo "当前标题: $PR_TITLE"
            echo ""
            echo "格式：[ID][模块] 描述"
            echo "示例："
            echo "  [F20260730sbrt][agent][Enhancement] speak 重试区分 thinking-only"
            echo "  [F20260727ui6x][web][BugFix] 对话界面多项 UI 修复"
            echo "  [F20260724glas][web] UI 玻璃材质体系重设计"
            echo "  [R20260728c5xt][research] claude5-context-engineering 洞察报告"
            echo ""
            echo "规则："
            echo "  - 前缀: F（feature/bugfix）或 R（research）"
            echo "  - 日期: 8位数字 YYYYMMDD"
            echo "  - 随机字符: 4位以上字母数字"
            echo "  - 模块: agent / web / prompt / research 等小写标签"
            exit 1
          fi
          echo "✅ PR 标题格式正确"

      # F20260825dva2: 特性 ID 日期校验——复用 scripts/validate-commit-date.mjs 单一实现
      - name: Check PR title feature ID date
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          RESULT=$(echo "$PR_TITLE" | node scripts/validate-commit-date.mjs 2>&1)
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ $RESULT"
            exit 1
          fi
          echo "✅ 特性 ID 日期校验通过"

      - name: Check if PR is up to date with main
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main:main
          MERGE_BASE=$(git merge-base HEAD main)
          MAIN_HEAD=$(git rev-parse main)
          if [ "$MERGE_BASE" != "$MAIN_HEAD" ]; then
            echo "❌ PR branch is behind main. Please rebase or merge main into your branch."
            echo "Merge base: $MERGE_BASE"
            echo "Main HEAD:  $MAIN_HEAD"
            exit 1
          fi
          echo "✅ PR branch is up to date with main"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Upgrade npm to match local version
        run: npm install -g npm@11.17.0

      - name: Install dependencies
        run: npm ci

      # F20260821kgts: lint gates 接入 CI（#366 PR-2：纪律≠机制，只挂 pre-commit 会被 --no-verify 绕过）
      # 以下四个只读源文件、零构建依赖，放 build 前获得快速反馈
      - name: Run fast lint gates (skills / tool-manifest / tests / capability-docs)
        run: |
          npm run lint:skills
          npm run lint:tool-manifest
          node scripts/lint-tests.mjs
          node scripts/lint-capability-docs.mjs

      - name: Run full project checks
        run: npm run check

      # F20260821kgts: lint:docs 复用 dist 编译产物（单一真相源），必须在 build 之后
      - name: Run docs frontmatter lint gate
        run: npm run lint:docs

      # F20260824ax376: PR 评估体系 - intent 字段校验（commit-time gate）
      - name: Run intent lint gate
        run: npm run lint:intent

      - name: Build web frontend (tsc + vite)
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Run web tests
        run: npm --prefix web test

      - name: Run tests
        run: npm test

  # P0-b: Golden Gate selftest-only 独立入口（零 LLM、不配置 LLM 端点）
  # 仅跑 selftest 层（good/bad 参考序列校验断言判别力，纯构造零真实请求）；
  # 采样层靠 LLM，本地跑不走 CI（方案 v6.2 mimo 定案：selftest-only 入口）。
  # 注意：golden.runner 的采样用例在无 LLM 时 it.skip，但 boot 仍需 bge-m3 就绪
  # （boot.ts L209 禁止静默降级）——CI 走「预置模型缓存」路径：见下方 models 缓存步骤。
  golden-selftest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Upgrade npm to match local version
        run: npm install -g npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run check

      # bge-m3 模型缓存（~1.2GB onnx 量化）：boot 禁止静默降级，无模型时 boot 超时 fail
      # （v4.2 终确认的「无锚点推测」处置：CI 实测后从三选一改为实测有效的路径 a+缓存）
      - name: Cache bge-m3 model
        uses: actions/cache@v4
        with:
          path: models/bge-m3
          key: bge-m3-${{ runner.os }}-v1

      - name: Download bge-m3 if not cached
        # --force 绕过脚本的 CI 跳过逻辑（L114：旧假设「CI 测试全 mock」——但 capability
        # boot 禁止降级（boot.ts L209），golden selftest 需要真模型；缓存命中时脚本
        # 自动跳过（L121 missing.length===0），force 只影响缺文件时是否下载）
        run: node scripts/download-bge-m3.mjs --force
        env:
          HF_ENDPOINT: https://hf-mirror.com

      # selftest-only：vitest 按用例名过滤 selftest 段——golden.runner 的用例为
      # `${id}（n=..，源 ..）` 整体用例，selftest 是其内嵌步骤，无法用 -t 过滤出
      # 「只 selftest」；改为依赖 LLM 未配置时采样段 it.skip 的既有语义：
      # 不提供 OTTER_TEST_LLM_API_KEY → 采样跳过，selftest 仍执行（L243 注释明示
      # 「selftest 无论 LLM 是否可用都跑」）。退出码交给 vitest——selftest fail = 红。
      - name: Run golden selftest (zero LLM, exit code enforced)
        run: npx vitest run --config vitest.capability.config.ts tests/capability/golden/golden.capability.test.ts
        env:
          # 零 LLM 声明的落地方式：不注入测试 LLM 端点（boot 读 config.test.yaml 基础配置 +
          # OTTER_TEST_* 环境变量覆盖；CI 环境两皆无 → 采样段 skip，selftest 全跑）
          OTTER_TEST_LLM_API_KEY: ""
          OTTER_TEST_LLM_MODEL: ""
