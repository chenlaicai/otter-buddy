name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Check PR title format
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # PR 标题格式：[ID][模块] 描述
          # ID: [F{日期}{随机字符}] 或 [R{日期}{随机字符}]
          # 模块: [agent] [web] [prompt] [research] 等
          if ! echo "$PR_TITLE" | grep -qE '^\[[FR][0-9]{8}[a-zA-Z0-9]{4,}\]\[[a-z]+\]'; then
            echo "❌ PR 标题格式错误"
            echo "当前标题: $PR_TITLE"
            echo ""
            echo "格式：[ID][模块] 描述"
            echo "示例："
            echo "  [F20260730sbrt][agent][Enhancement] speak 重试区分 thinking-only"
            echo "  [F20260727ui6x][web][BugFix] 对话界面多项 UI 修复"
            echo "  [F20260724glas][web] UI 玻璃材质体系重设计"
            echo "  [R20260728c5xt][research] claude5-context-engineering 洞察报告"
            echo ""
            echo "规则："
            echo "  - 前缀: F（feature/bugfix）或 R（research）"
            echo "  - 日期: 8位数字 YYYYMMDD"
            echo "  - 随机字符: 4位以上字母数字"
            echo "  - 模块: agent / web / prompt / research 等小写标签"
            exit 1
          fi
          echo "✅ PR 标题格式正确"

      - name: Check if PR is up to date with main
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main:main
          MERGE_BASE=$(git merge-base HEAD main)
          MAIN_HEAD=$(git rev-parse main)
          if [ "$MERGE_BASE" != "$MAIN_HEAD" ]; then
            echo "❌ PR branch is behind main. Please rebase or merge main into your branch."
            echo "Merge base: $MERGE_BASE"
            echo "Main HEAD:  $MAIN_HEAD"
            exit 1
          fi
          echo "✅ PR branch is up to date with main"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Upgrade npm to match local version
        run: npm install -g npm@11.17.0

      - name: Install dependencies
        run: npm ci

      # F20260821kgts: lint gates 接入 CI（#366 PR-2：纪律≠机制，只挂 pre-commit 会被 --no-verify 绕过）
      # 以下四个只读源文件、零构建依赖，放 build 前获得快速反馈
      - name: Run fast lint gates (skills / tool-manifest / tests / capability-docs)
        run: |
          npm run lint:skills
          npm run lint:tool-manifest
          node scripts/lint-tests.mjs
          node scripts/lint-capability-docs.mjs

      - name: Run full project checks
        run: npm run check

      # F20260821kgts: lint:docs 复用 dist 编译产物（单一真相源），必须在 build 之后
      - name: Run docs frontmatter lint gate
        run: npm run lint:docs

      - name: Build web frontend (tsc + vite)
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Run web tests
        run: npm --prefix web test

      - name: Run tests
        run: npm test
