# Otter Buddy 中枢 nginx 站点——TLS 终止 + HTTP→HTTPS 重定向 + connector WS 透传
# 安装：sudo cp nginx-otter.conf /etc/nginx/conf.d/ && sudo nginx -t && sudo systemctl reload nginx
# 证书：先跑 setup-tls.sh（Certbot webroot 签发 otter.<IP>.sslip.io）
# 域名形态：sslip.io 把 IP 嵌入域名免买域名（沿 colink-agent 先例）

server {
    server_name otter.60.205.214.148.sslip.io;
    listen 80;
    listen [::]:80;
    # ACME webroot（Certbot 续期走这里，必须在 TLS server 块之外可达）
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    server_name otter.60.205.214.148.sslip.io;
    listen 443 ssl;
    listen [::]:443 ssl;

    ssl_certificate     /etc/letsencrypt/live/otter.60.205.214.148.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/otter.60.205.214.148.sslip.io/privkey.pem;

    # 上传：中枢自己允许单请求 120MB（`Content-Length` 预检）/ 单文件 25MB。nginx 默认 1m，
    # 不抬就会被反代层先 413 掉——图/附件上传将全坏，而中枢日志里看不到任何东西。
    client_max_body_size 120m;

    # 浏览器→反代这一段必须永远 HTTPS：首次成功 HTTPS 后，HSTS 阻止后续明文降级。
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 中枢 HTTP 面（web UI + API）
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 声明式身份头只对本机直连生效，到达中枢前必须清空：
        # 不清的话客户端自带一个 X-Otter-User-Role: admin 就能绕过登录（反代后面所有请求
        # 在 node 侧看起来都来自 127.0.0.1，转发头只是第二道判据，这里是第一道）。
        proxy_set_header X-Otter-User-Id "";
        proxy_set_header X-Otter-User-Role "";
    }

    # SSE 事件流（会话订阅、发消息/重试与牌局帧推进）：必须关缓冲，否则 nginx 会把事件
    # 攒在缓冲区里「看起来很慢」而实际是攒批。所有 streamEvents 路由与牌局路由都在此覆盖。
    location ~ ^/api/(?:conversations/[^/]+/(?:subscribe|messages)|invokes/[^/]+/retry|otters/[^/]+/retry|mahjong/rooms/[^/]+/events)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Otter-User-Id "";
        proxy_set_header X-Otter-User-Role "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # connector WS 面：升级头透传（长连接）。超时 3600s 仅兑异常半开——
    # connector 协议有应用层心跳（hub 回 heartbeat.ack），活跃连接不会触 idle 断开。
    location /connector-ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
