# Otter Buddy 中枢 nginx 站点（阶段 6a）——TLS 终止 + HTTP→HTTPS 重定向 + connector WS 透传
# 安装：sudo cp nginx-otter.conf /etc/nginx/conf.d/ && sudo nginx -t && sudo systemctl reload nginx
# 证书：先跑 setup-tls.sh（Certbot webroot 签发 otter.<IP>.sslip.io）
# 域名形态：sslip.io 把 IP 嵌入域名免买域名（沿 colink-agent 先例）

server {
    server_name otter.60.205.214.148.sslip.io;
    listen 80;
    listen [::]:80;
    # ACME webroot（Certbot 续期走这里，必须在 TLS server 块之外可达）
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    server_name otter.60.205.214.148.sslip.io;
    listen 443 ssl;
    listen [::]:443 ssl;

    ssl_certificate     /etc/letsencrypt/live/otter.60.205.214.148.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/otter.60.205.214.148.sslip.io/privkey.pem;

    # 中枢 HTTP 面（web UI + API）
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # connector WS 面：升级头透传（长连接， idle 放宽）
    location /connector-ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
